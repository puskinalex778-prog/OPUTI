name: Build All 3D Lab APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-lab3d:
    name: Лаборатория 3D (Lab3D)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Lab3D APK
        working-directory: Lab3D
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p out_apks
          cp app/build/outputs/apk/debug/app-debug.apk "out_apks/Lab3D-Opyty-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Lab3D-apk
          path: Lab3D/out_apks/*.apk

  build-young-scientist-3d:
    name: YoungScientist3D
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build YoungScientist3D APK
        working-directory: YoungScientist3D
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p out_apks
          cp app/build/outputs/apk/debug/app-debug.apk "out_apks/YoungScientist3D-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: YoungScientist3D-apk
          path: YoungScientist3D/out_apks/*.apk
